name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-24.04
            args: ""
          - platform: windows-latest
            args: "--bundles nsis,msi"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: bun install --frozen-lockfile

      - name: commits since the previous release
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          if prev=$(git describe --tags --abbrev=0 'HEAD^' 2>/dev/null); then
            range="${prev}..HEAD"
          else
            range="HEAD"
          fi
          delimiter="RELEASE_NOTES_EOF"
          {
            echo "body<<${delimiter}"
            git log --format='%H' "$range" | while read -r sha; do
              files=$(git diff-tree --no-commit-id --name-only -r "$sha")
              keep=0
              while IFS= read -r path; do
                [ -z "$path" ] && continue
                case "$path" in
                  *.test.ts|*.test.js|*.test.vue|*.spec.ts|*.spec.js) continue ;;
                esac
                case "$path" in
                  apps/client/src/*|apps/client/src-tauri/src/*|apps/backend/src/*|apps/landing/*|packages/file-manager/src/*)
                    keep=1
                    break
                    ;;
                esac
              done <<< "$files"
              [ "$keep" = 1 ] || continue
              subject=$(git log -1 --format='%s' "$sha")
              safe=$(printf '%s' "$subject" | sed 's/\\/\\\\/g; s/\[/\\[/g; s/\]/\\]/g')
              printf -- '- [%s](%s/%s/commit/%s)\n' "$safe" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$sha"
            done
            echo
            echo "See the assets to download this version and install."
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          VITE_PUBLIC_BASE_URL: ${{ secrets.VITE_PUBLIC_BASE_URL }}
          VITE_LANDING_URL: https://www.pile-commander.com
        with:
          projectPath: apps/client
          tauriScript: bun --filter @pile-commander/client tauri
          tagName: v__VERSION__
          releaseName: "v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
