[package]
name = "pile-commander"
version = "2.7.1"
description = "File manager with unusual possibilities"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-xattrs = { path = "../../../packages/tauri-plugin-xattrs" }
reqwest = { version = "0.12.28", default-features = false, features = ["native-tls", "stream"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["sync", "time", "macros"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
trash = "5"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"

# Same objc2 line wry 0.55 uses. macOS WKWebView bounce is turned off through these.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSView", "NSResponder", "NSScrollView"] }
# The Trash path of a deleted item, so undo can put it back (trash_path)
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }
